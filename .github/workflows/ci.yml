name: Checkout Core CI & Compliance Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-engine:
    name: Typecheck, Build & ACID Compliance (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install TypeScript & Node.js Type Definitions
        run: npm install --no-save typescript @types/node

      - name: Normalize import syntax & Compile TypeScript
        run: |
          find src -name "*.ts" -exec sed -i 's/^Import /import /g' {} +
          npx tsc --project tsconfig.json --types node

      - name: Execute AVS, ISO-3166, Idempotency & 2PC Test Suite
        run: node --test tests/checkout.test.js
